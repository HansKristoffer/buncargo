# BuncargoBar releases, tagged `bar-v*` so they never mix with the CLI's `v*`.
#
# Called by release.yml with the version Release Please just tagged; the
# dispatch is the escape hatch for rebuilding a release by hand. A pushed tag
# does not trigger this on its own any more: Release Please creates the tag with
# the workflow token, which never fires other workflows.
#
# `buncargo bar install` and `buncargo bar update` read the assets this
# publishes, so the names here are a contract: `BuncargoBar-<version>.zip` and a
# matching `.sha256`. The CLI is the only updater; the app has no checker. Until
# the zip lands, the CLI skips the asset-less release and keeps offering the
# previous one.
name: Release menubar

on:
  workflow_call:
    inputs:
      version:
        description: "Version to release, without the bar-v prefix (e.g. 1.0.6)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the bar-v prefix (e.g. 1.0.6)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      TAG: bar-v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcode-select --print-path
          swift --version

      - name: Remote discovery and shared schema tests
        run: swift test --package-path menubar

      - name: Build app bundle
        working-directory: menubar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package.sh

      # Skipped entirely until the Apple secrets exist; the ad-hoc signed bundle
      # ships in the meantime, which is why `buncargo bar install` clears the
      # quarantine attribute.
      - name: Sign and notarize
        if: >-
          env.APPLE_CERTIFICATE_P12 != '' &&
          env.APPLE_ID != '' &&
          env.APPLE_TEAM_ID != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        working-directory: menubar
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          codesign --force --deep --options runtime --timestamp \
            --sign "$IDENTITY" BuncargoBar.app
          ditto -c -k --sequesterRsrc --keepParent BuncargoBar.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple BuncargoBar.app
          rm -f notarize.zip

      # A release that cannot decode the current runs.json fails here rather
      # than on someone's Mac.
      - name: Smoke test the built bundle
        run: BUNDLE=menubar/BuncargoBar.app bash menubar/scripts/smoke-test.sh

      - name: Package
        working-directory: menubar
        run: |
          # ditto, not zip: it is the only extractor that preserves a bundle's
          # code signature, and --sequesterRsrc keeps resource forks out of the
          # payload instead of interleaved with it.
          ditto -c -k --sequesterRsrc --keepParent \
            BuncargoBar.app "BuncargoBar-${VERSION}.zip"
          shasum -a 256 "BuncargoBar-${VERSION}.zip" > "BuncargoBar-${VERSION}.zip.sha256"

      # Release Please already created the release with notes from the
      # changelog; a manual dispatch for a tag without one still gets a release.
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: menubar
        run: |
          ASSETS=("BuncargoBar-${VERSION}.zip" "BuncargoBar-${VERSION}.zip.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "BuncargoBar $VERSION" --generate-notes
          fi
