# Called by release.yml after Release Please has bumped package.json and tagged
# the commit; the dispatch is the escape hatch for republishing by hand.
# Publication consumes the exact tarball built and verified in `candidate`; no
# version mutation or rebuild happens afterward. CI already ran lint, tests and
# tarball verification across OS/Bun cells for the PR and for the merge, so the
# release commit (package.json + CHANGELOG.md) is not re-verified on a matrix.
name: Publish to npm

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Validate and build candidate once
        run: |
          bun run lint
          bun test
          bun run build
          bun run verify:package
          bun scripts/verify-docker.ts
      - name: Record candidate commit and version
        run: |
          node -p 'JSON.stringify({ commit: process.env.GITHUB_SHA, version: require("./package.json").version })' > .buncargo/artifacts/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate-${{ github.sha }}
          path: .buncargo/artifacts/
          include-hidden-files: true

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Setup npm trusted publishing support
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ github.sha }}
          path: candidate/
      - name: Publish verified tarball with provenance
        run: npm publish ./candidate/*.tgz --ignore-scripts --access public --provenance
