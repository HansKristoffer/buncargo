# Releasing on merge (docs/release-flow-plan.md).
#
# Release Please keeps one PR open on main proposing the next CLI and/or
# BuncargoBar version from conventional PR titles. Merging it creates the tags
# and GitHub releases; the jobs below then publish in this same run, because a
# tag created with the workflow token never triggers another workflow.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cli_released: ${{ steps.rp.outputs.release_created }}
      bar_released: ${{ steps.rp.outputs['menubar--release_created'] }}
      bar_version: ${{ steps.rp.outputs['menubar--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.cli_released == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write

  release-bar:
    needs: release-please
    if: needs.release-please.outputs.bar_released == 'true'
    uses: ./.github/workflows/release-menubar.yml
    with:
      version: ${{ needs.release-please.outputs.bar_version }}
    secrets: inherit
    permissions:
      contents: write
