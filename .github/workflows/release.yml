# Releasing on merge (docs/releasing.md).
#
# Release Please keeps one PR open on main proposing the next CLI and/or
# BuncargoBar version from conventional PR titles. Merging it creates the tags
# and GitHub releases. This run publishes the CLI and menu bar directly.
# The relay deployment gates clients. A workflow-created tag never triggers another workflow.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cli_released: ${{ steps.targets.outputs.cli_released }}
      publish_npm: ${{ steps.targets.outputs.publish_npm }}
      bar_released: ${{ steps.targets.outputs.bar_released }}
      bar_version: ${{ steps.targets.outputs.bar_version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
      # GITHUB_TOKEN cannot trigger PR CI automatically; dispatch it explicitly.
      - name: Check the release PR
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_PRS: ${{ steps.rp.outputs.prs }}
        with:
          script: |
            for (const pr of JSON.parse(process.env.RELEASE_PRS || '[]')) {
              const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
              if (data.state !== 'open' || data.head.repo.full_name !== context.payload.repository.full_name) continue;
              for (const workflow_id of ['ci.yml', 'menubar-ci.yml']) {
                await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id, ref: data.head.ref });
              }
            }
      - uses: actions/checkout@v5
      - name: Resolve releases for this commit, including retries
        id: targets
        uses: actions/github-script@v8
        with:
          script: |
            const { releaseTargets } = require('./scripts/release-targets.cjs');
            const versions = require('./.release-please-manifest.json');
            const targets = await releaseTargets({ github, context, versions });
            for (const [name, value] of Object.entries(targets)) core.setOutput(name, value);

  deploy-connect:
    needs: release-please
    if: needs.release-please.outputs.cli_released == 'true' || needs.release-please.outputs.bar_released == 'true'
    uses: ./.github/workflows/deploy-connect.yml
    with:
      deploy: ${{ needs.release-please.outputs.cli_released == 'true' }}
    secrets: inherit
    permissions:
      contents: read

  publish-npm:
    needs: [release-please, deploy-connect]
    if: needs.release-please.outputs.publish_npm == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write

  release-bar:
    needs: [release-please, deploy-connect]
    if: needs.release-please.outputs.bar_released == 'true'
    uses: ./.github/workflows/release-menubar.yml
    with:
      version: ${{ needs.release-please.outputs.bar_version }}
    secrets: inherit
    permissions:
      contents: write
