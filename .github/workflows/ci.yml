# Provider/privileged integration suites stay separate from ordinary PR checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job so a formatting slip fails in a minute as one check, not as
  # four test cells after the slow parts have run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Typecheck and lint
        run: bun run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        bun: ["1.4.2", latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Verify the packed consumer artifact
        run: bun run verify:package

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Show runtime versions
        run: |
          docker version
          docker compose version
      - name: Verify container reuse, jobs, preparation and shutdown
        run: bun scripts/verify-docker.ts

  frp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Verify frp TLS, HTTP streaming, WebSockets and private TCP
        run: bun run test:integration-frp
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: false
      - name: Build the production relay artifact
        run: |
          bash server/deploy/build.sh candidate-server
          candidate-server/frps verify -c candidate-server/frps.json
          bun scripts/verify-connect-compression.ts candidate-server/caddy
          bash -n server/deploy/*.sh
