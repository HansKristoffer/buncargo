# Provider/privileged integration suites stay separate from ordinary PR checks.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR title
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            let title = context.payload.pull_request?.title;
            if (!title) {
              const { data: prs } = await github.rest.pulls.list({
                ...context.repo, state: 'open',
                head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              });
              if (!prs.length) return;
              title = prs[0].title;
            }
            if (!/^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([^\r\n]+\))?!?: \S[^\r\n]*$/.test(title)) {
              core.setFailed('Use a conventional PR title, for example fix: handle startup failures or feat!: change the public API.');
            }

  # Its own job so a formatting slip fails in a minute as one check, not as
  # four test cells after the slow parts have run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Typecheck and lint
        run: bun run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        bun: ["1.4.2"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Verify the packed consumer artifact
        run: bun run verify:package

  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build:js
      - name: Check startup and cancellation budgets
        run: bun run benchmark:startup --samples=5 --budget-scale=1.5
      - name: Check 200 library sessions for leaked resources
        run: bun run test:stress-sessions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-${{ matrix.os }}
          path: .buncargo/benchmarks/startup.json
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Show runtime versions
        run: |
          docker version
          docker compose version
      - name: Verify container reuse, jobs, preparation and shutdown
        run: bun scripts/verify-docker.ts

  frp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Verify frp TLS, HTTP streaming, WebSockets and private TCP
        run: bun run test:integration-frp
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: false
      - name: Build the production relay artifact
        run: |
          bash server/deploy/build.sh candidate-server
          candidate-server/frps verify -c candidate-server/frps.json
          bun scripts/verify-connect-compression.ts candidate-server/caddy
          bash -n server/deploy/*.sh
